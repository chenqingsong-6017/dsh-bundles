# dsh-projcache-delta —— 增量 checkpoint 的 profile 覆盖层（canonical 行）
#
# 这 6 行同时是两处安装方式的唯一真源：
#   1) install.mjs --apply 把本文件正文（去注释）拼进 profile 的 cordis.patch.yml；
#   2) 若改走 plugin_manager 安装本包为 bundle，bundle 层会直接应用同一份 patch。
# 两者只能选一，否则同样的 id 会应用两次。
#
# 做法：停用官方三个存储件，换成同语义的本地 fork（只有存储介质格式不同）。
# 终局：上游合并后本包与安装脚本一起删除，只留官方包。
- id: storage-json
  disabled: true
- id: storage-domain
  disabled: true
- id: session-projection-cache
  disabled: true
- insert:
    - id: storage-json-delta
      name: '@local/dsh-projcache-delta/lib/storage-json.js'
      config:
        root: !!js dshHomePath('storages')
    - id: storage-domain-delta
      name: '@local/dsh-projcache-delta/lib/storage-domain.js'
      config:
        backend: json
    - id: session-projection-cache-delta
      name: '@local/dsh-projcache-delta/lib/session-projection-cache.js'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000
