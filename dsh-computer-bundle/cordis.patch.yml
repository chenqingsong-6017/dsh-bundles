# Computer-use bundle: mounts the shared provider registry plus the
# native Cua Driver runtime (win32-x64-msvc binary from @trycua/cua-driver).
- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: computer-use-cua-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'
    # 诊断行：本 bundle 自己的宿主半体（index.js），只提供 computer_status —— 报挂载状态，
    # 不注册任何桌面工具、不改上面两行的行为。挂载失败时它也照样加载，好让工具面能回答「为什么不可用」。
    - id: computer-status
      name: '@local/dsh-computer-bundle'
