- insert:
    - id: memory
      name: '@local/dsh-memory'
      config:
        # 记忆数据放 D 盘
        storeDir: 'D:\AI\dsh-data\memory'
        # v4.1（P2）：存储后端。sqlite = 单文件 memory.db（node:sqlite 内置，WAL+FTS5）；json = 旧 memory.json（回滚开关）。
        # 首次以 sqlite 启动会自动迁移：先备份 JSON 到 backups/pre-sqlite-*，回读 deepEqual 通过才替换；失败拒绝启动、原 JSON 不动。
        # 回滚：把这里改成 storage: 'json' 并重载插件（memory.json 一直保留，不会丢数据）。
        storage: 'sqlite'
        # v4.1（P2.2）：检索路径。index = FTS5 候选集 + df 统计（与旧全量扫描逐位一致，差分测试把关）；scan = 回退旧全量遍历。
        retrieval: 'index'
        # 存储预算：记忆总量上限（字符），超了拒绝写入而不是悄悄淘汰
        # v3.21：8000 → 12000。⚠ 这里会**覆盖代码里的 DEFAULT_MAX_BYTES**：
        # 只改代码默认值而不改这一行，生产上仍然是 8000（2026-10-30 实测踩到）。
        maxBytes: 12000
        # 注入预算：每轮系统提示里最多花多少字符。
        # v1.2：pinned 全文常驻；其余一律出「id + tag + 日期 + 摘要」索引行，
        # 装不下的条目在块尾「⚠ 另有 N 条未注入」里逐条点名（不再静默丢弃）。
        # v3.22（2026-10-31）：1500 → 2500。51 条记忆 8454 字，1500 只够 6 条全文 + 8 条索引，
        # 其余 33 条只剩 id 可见；提到 2500 后约能全文展开 15 条。代价约每轮 +500 tokens。
        maxInjectChars: 2500
        # v2.2：scope 加分（cwd 命中条目在召回时加权 ×1.4；对不上不加分、不过滤）
        # 映射表可覆盖，默认 plugin-dev→D:\AI\dsh-bundles / data-infra→D:\AI\dsh-data / dsh-date→D:\AI-date\dsh-date
        # scopeRoots:
        #   plugin-dev: ['D:\AI\dsh-bundles']
        # v2.2：自动沉淀候选（影子模式，只写 candidates.json，不直接入库；false 可关）
        captureCandidates: true
        # v3.26：规则文件沉淀（从 AGENTS.md / .dsh/rules 自动抽硬规则进库）单独开关。
        # 本机规则已由 AGENTS.md 与 .dsh/rules 每轮注入，再沉淀只会重复占存储预算
        # （2026-10-31 实测：清掉的规则在重启后被重新自动入库）→ 本 profile 关掉。
        # 保留 captureCandidates，用户消息里的偏好仍会自动进候选池。
        captureRuleFiles: false
        # v2.3：相关性覆盖率下限（top 分数 ÷ 查询 idf 总和，0-1，语料规模无关）；低于它宁可不注入相关全文
        # 默认 0.15（用 36 题微基准校准：正例最低 0.186、负例最高 0.128）；想更保守可调 0.18-0.2
        # relevanceFloor: 0.15
