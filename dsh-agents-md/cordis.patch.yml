# 重新启用官方 agent-instructions 行。
#
# 背景：@deepseek-ai/dsh-base 默认挂着
#   - id: agent-instructions
#     name: '@deepseek-ai/dsh-agent-instructions'
#     config: { maxBytes: 65536 }
# 但 preset 层把它 disabled: true 了（preset 需要独占某些 host 行）。
# 本 bundle 排在 profile 的 bundle 列表末尾，按"后写赢"覆盖回 false。
#
# 作用：第一轮请求前加载 AGENTS.md / CLAUDE.md 链
#   - 用户全局：$DSH_HOME/AGENTS.md、$DSH_AGENTS_HOME/AGENTS.md（默认 ~/.agents）
#   - 项目：从仓库根（.git 标记）到会话工作目录，逐层 AGENTS.md / CLAUDE.md
#   - 附加本地覆盖：AGENTS.local.md / CLAUDE.local.md
#   - 预算：整条渲染基线最多 65536 字节（超出先丢宽泛文件，最后才截断最具体的）
- id: agent-instructions
  disabled: false
  config:
    maxBytes: 65536
